# Build swosgfx for Windows, macOS and Linux on every push and pull request,
# run the tests, and keep the executables as artifacts. A push to main also
# replaces the rolling "latest" pre-release (one zip per platform, the same
# names every time: .../releases/download/latest/swosgfx-<platform>.zip); a
# tag v* makes a release of its own, its zips named with the version.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            exe: swosgfx.exe
          - name: macos-universal
            os: macos-15
            exe: swosgfx
            cmake_args: -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          - name: linux-x64
            os: ubuntu-22.04
            exe: swosgfx
          - name: linux-arm64
            os: ubuntu-22.04-arm
            exe: swosgfx
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSWOSGFX_TESTS=ON ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: bash
        run: |
          mkdir -p dist/swosgfx
          bin=build/${{ matrix.exe }}
          [ -f "$bin" ] || bin=build/Release/${{ matrix.exe }}
          cp "$bin" dist/swosgfx/
          cp README.md LICENSE dist/swosgfx/
          cp -r assets dist/swosgfx/
          "dist/swosgfx/${{ matrix.exe }}" -h > /dev/null || true
          if [ "$RUNNER_OS" = "macOS" ]; then lipo -info "dist/swosgfx/${{ matrix.exe }}"; fi

      - uses: actions/upload-artifact@v4
        with:
          name: swosgfx-${{ matrix.name }}
          path: dist/swosgfx

  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: release-${{ github.ref }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Archive
        run: |
          cd artifacts
          suffix=""
          case "$GITHUB_REF" in refs/tags/*) suffix="-${GITHUB_REF_NAME}" ;; esac
          for d in swosgfx-*; do
            [ -d "$d" ] || continue
            chmod +x "$d/swosgfx" 2>/dev/null || true
            (cd "$d" && zip -qr "../$d$suffix.zip" .)
          done
          ls -la

      - name: Latest (main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short=$(echo "$GITHUB_SHA" | cut -c1-7)
          gh release delete latest --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create latest artifacts/*.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --title "Latest build ($short)" \
            --notes "swosgfx built from main at $GITHUB_SHA. Replaced by every push to main; a tagged version has a release of its own."

      - name: Version (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
